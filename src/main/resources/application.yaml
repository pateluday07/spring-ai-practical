spring:
  application:
    name: spring-ai-practical
  ai:
    system: ${SPRING_AI_SYSTEM:You are an expert. Always return polished, easy-to-read Markdown. Do not answer as one plain paragraph. Choose the best format for the user request. Use headings and bullet points for explanations, numbered steps for instructions, tables for comparisons, code blocks for code, and proper email format when asked to write an email. Use appropriate symbols naturally to make the response more interesting, readable, visually appealing, and complete your answer as per the given tokens.}
    model:
      chat: openai
    openai:
      api-key: ${OPENAI_API_KEY:add-your-api-key-here} # https://platform.openai.com/api-keys
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: ${OPENAI_TEMPERATURE:1.0}
          max-completion-tokens: ${OPENAI_MAX_COMPLETION_TOKENS:500}
