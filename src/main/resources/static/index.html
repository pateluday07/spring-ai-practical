<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Stream Demo</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="app-shell">
    <section class="workspace" aria-label="AI stream chat">
        <header class="topbar">
            <div>
                <span class="channel-name">Byte &amp; Beyond With Uday</span>
                <h1>AI Stream Demo</h1>
                <p id="statusText">Ready</p>
            </div>
            <div class="status-pill" id="statusPill">Idle</div>
        </header>

        <section class="chat-layout">
            <form class="composer" id="chatForm">
                <div class="composer-fields">
                    <label for="prompt">Prompt</label>
                    <textarea class="prompt-input" id="prompt" name="prompt" rows="7">How does Kubernetes handle self-healing?</textarea>

                    <label for="system">System instructions</label>
                    <textarea class="system-input" id="system" name="system" rows="4" placeholder="Optional. Leave blank to use application.yaml default."></textarea>

                    <div class="settings-grid">
                        <label>
                            Provider
                            <select id="provider" name="provider">
                                <option value="openai" selected>OpenAI (ChatGPT)</option>
                                <option value="gemini">Google (Gemini)</option>
                            </select>
                        </label>
                        <label>
                            Model
                            <input id="model" name="model" value="gpt-5.4-nano" autocomplete="off">
                        </label>
                        <label>
                            Max tokens
                            <input id="maxCompletionTokens" name="maxCompletionTokens" type="number" min="1" max="4000" value="1000">
                        </label>
                        <label>
                            Temperature
                            <input id="temperature" name="temperature" type="number" min="0" max="2" step="0.1" value="1">
                        </label>
                    </div>
                </div>

                <div class="actions">
                    <button class="primary-button" type="submit" id="sendButton">Send</button>
                    <button class="secondary-button" type="button" id="stopButton" disabled>Stop</button>
                    <button class="secondary-button" type="button" id="clearButton">Clear</button>
                </div>
            </form>

            <section class="response-panel" aria-label="Streaming answer">
                <div class="panel-header">
                    <h2>Response</h2>
                    <div class="response-tools">
                        <span id="tokenCounter">0 chunks</span>
                    </div>
                </div>
                <div class="response-output" id="responseOutput" aria-live="polite"></div>
            </section>

            <aside class="chunk-panel" aria-label="Stream chunks">
                <div class="panel-header">
                    <h2>Chunks</h2>
                    <span id="elapsedTime">0.0s</span>
                </div>
                <ol class="chunk-list" id="chunkList"></ol>
            </aside>
        </section>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
